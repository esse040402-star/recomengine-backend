name: 기존프로젝트 자동 검증

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'integration/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: FastAPI / mock tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 기존프로젝트
    env:
      USE_MOCK_DB: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check relocated relative paths
        run: |
          python -c "from pathlib import Path; from app.main import FRONTEND_DIR; assert FRONTEND_DIR == Path('frontend/dist').resolve(), FRONTEND_DIR"
          python -c "from app.services.market import CATALOG_FILE; assert CATALOG_FILE.exists(), CATALOG_FILE"
          python -c "from app.mock_db import SEED_FILE; assert SEED_FILE.exists(), SEED_FILE"
          python -c "from scripts.export_catalog import DEFAULT_SOURCE; assert (DEFAULT_SOURCE / 'catalog.json').exists(), DEFAULT_SOURCE"
      - name: Test backend (no real database)
        run: python -m pytest -q

  frontend:
    name: React / tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 기존프로젝트/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 기존프로젝트/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
